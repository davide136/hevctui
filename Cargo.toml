[package]
name = "hevctui"
version = "3.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["wgpu", "default_fonts"] }
egui_extras = "=0.36.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
rayon = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 2
